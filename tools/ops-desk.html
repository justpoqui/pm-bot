<title>Ops Desk</title>
<style>
  :root {
    --bg: #EEF1F0;
    --surface: #FFFFFF;
    --surface-2: #F5F7F6;
    --border: #DADFE0;
    --text: #1B2126;
    --text-dim: #5B6570;
    --text-faint: #8A929B;
    --accent: #1F8A78;
    --accent-ink: #FFFFFF;
    --good: #2F8F4E;
    --good-bg: #E4F3E7;
    --warning: #9C6A0C;
    --warning-bg: #FBEED4;
    --critical: #B23A30;
    --critical-bg: #FBE4E1;
    --shadow: 0 1px 2px rgba(20, 23, 28, 0.06), 0 4px 16px rgba(20, 23, 28, 0.05);
    --serif: Iowan Old Style, "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    --sans: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171C;
      --surface: #1B1F26;
      --surface-2: #21262E;
      --border: #2C323C;
      --text: #ECE9E2;
      --text-dim: #A2AAB4;
      --text-faint: #6B7280;
      --accent: #35B39E;
      --accent-ink: #0A1512;
      --good: #6FCB8B;
      --good-bg: #16281C;
      --warning: #E3B34E;
      --warning-bg: #2E2510;
      --critical: #E1786D;
      --critical-bg: #301813;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #14171C;
    --surface: #1B1F26;
    --surface-2: #21262E;
    --border: #2C323C;
    --text: #ECE9E2;
    --text-dim: #A2AAB4;
    --text-faint: #6B7280;
    --accent: #35B39E;
    --accent-ink: #0A1512;
    --good: #6FCB8B;
    --good-bg: #16281C;
    --warning: #E3B34E;
    --warning-bg: #2E2510;
    --critical: #E1786D;
    --critical-bg: #301813;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
    color-scheme: dark;
  }

  :root[data-theme="light"] {
    --bg: #EEF1F0;
    --surface: #FFFFFF;
    --surface-2: #F5F7F6;
    --border: #DADFE0;
    --text: #1B2126;
    --text-dim: #5B6570;
    --text-faint: #8A929B;
    --accent: #1F8A78;
    --accent-ink: #FFFFFF;
    --good: #2F8F4E;
    --good-bg: #E4F3E7;
    --warning: #9C6A0C;
    --warning-bg: #FBEED4;
    --critical: #B23A30;
    --critical-bg: #FBE4E1;
    --shadow: 0 1px 2px rgba(20, 23, 28, 0.06), 0 4px 16px rgba(20, 23, 28, 0.05);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }
  ::selection { background: var(--accent); color: var(--accent-ink); }

  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-radius: 3px;
  }

  .app {
    display: grid;
    grid-template-columns: 264px 1fr;
    min-height: 100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 20px 14px 20px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .wordmark {
    font-family: var(--serif);
    font-size: 21px;
    letter-spacing: 0.2px;
    padding: 0 6px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .wordmark .glyph { font-size: 17px; }
  .wordmark small {
    font-family: var(--sans);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
  }

  .biz-switch {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .biz-label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--text-faint);
    padding: 0 6px;
  }
  .biz-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text);
    text-align: left;
    cursor: pointer;
    width: 100%;
  }
  .biz-btn:hover { background: var(--surface-2); }
  .biz-btn.active {
    background: var(--surface-2);
    border-color: var(--border);
    font-weight: 600;
  }
  .biz-btn .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    flex: none;
    opacity: 0;
  }
  .biz-btn.active .dot { opacity: 1; }
  .biz-btn .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  nav.depts { display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--text-dim);
    border: none;
    background: transparent;
    text-align: left;
    width: 100%;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--text); }
  .nav-item.active { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .nav-item .ic { width: 16px; text-align: center; font-size: 13px; opacity: 0.9; }
  .nav-item .badge {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10.5px;
    padding: 1px 6px;
    border-radius: 20px;
    background: var(--critical-bg);
    color: var(--critical);
    font-variant-numeric: tabular-nums;
  }
  .nav-item.active .badge { background: rgba(255,255,255,0.22); color: var(--accent-ink); }

  .sidebar-foot {
    margin-top: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }
  .ghost-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 8px;
    border-radius: 7px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 12.5px;
    text-align: left;
  }
  .ghost-btn:hover { background: var(--surface-2); color: var(--text); }

  /* ---------- Main ---------- */
  main {
    padding: 30px 40px 60px;
    max-width: 1080px;
  }
  header.pagehead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  header.pagehead h1 {
    font-family: var(--serif);
    font-weight: 500;
    font-size: 27px;
    margin: 0;
    letter-spacing: 0.1px;
    text-wrap: balance;
  }
  header.pagehead .sub {
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 3px;
  }
  .head-actions { display: flex; gap: 8px; }

  /* Stat tiles */
  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
    gap: 12px;
    margin-bottom: 26px;
  }
  .tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
  }
  .tile .label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
  }
  .tile .value {
    font-family: var(--serif);
    font-size: 25px;
    margin-top: 5px;
    font-variant-numeric: tabular-nums;
  }
  .tile .value.good { color: var(--good); }
  .tile .value.warning { color: var(--warning); }
  .tile .value.critical { color: var(--critical); }
  .tile .foot { margin-top: 4px; font-size: 11.5px; color: var(--text-dim); }

  section.block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    overflow: hidden;
  }
  .block-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }
  .block-head h2 {
    font-family: var(--serif);
    font-size: 15.5px;
    font-weight: 600;
    margin: 0;
  }
  .block-head .count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
  }
  .block-body { padding: 4px 0; }
  .block-body.pad { padding: 14px 16px; }

  /* Attention list */
  .attn-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .attn-row:last-child { border-bottom: none; }
  .attn-chip {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 7px;
    border-radius: 20px;
    flex: none;
    font-weight: 600;
  }
  .attn-chip.critical { background: var(--critical-bg); color: var(--critical); }
  .attn-chip.warning { background: var(--warning-bg); color: var(--warning); }
  .attn-text { flex: 1; }
  .attn-when { color: var(--text-faint); font-size: 12px; flex: none; font-variant-numeric: tabular-nums; }
  .empty {
    padding: 22px 16px;
    color: var(--text-faint);
    font-size: 13px;
    text-align: center;
  }

  /* Tables */
  .twrap { overflow-x: auto; }
  table.data {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.data th {
    text-align: left;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-faint);
    font-weight: 600;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  table.data td {
    padding: 3px 6px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  table.data tbody tr:hover { background: var(--surface-2); }
  table.data tbody tr:last-child td { border-bottom: none; }

  .cell-input, .cell-select {
    width: 100%;
    min-width: 90px;
    padding: 7px 7px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    color: var(--text);
  }
  .cell-input:hover, .cell-select:hover { border-color: var(--border); }
  .cell-input:focus, .cell-select:focus { border-color: var(--accent); background: var(--surface); outline: none; }
  .cell-input.num, .cell-input.date { font-variant-numeric: tabular-nums; }
  td.col-name .cell-input { min-width: 160px; }
  td.col-wide .cell-input { min-width: 220px; }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    font-weight: 600;
  }
  .status-pill .sw { width: 7px; height: 7px; border-radius: 50%; flex: none; }

  .row-del {
    border: none;
    background: transparent;
    color: var(--text-faint);
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 13px;
  }
  .row-del:hover { background: var(--critical-bg); color: var(--critical); }

  .add-row-bar { padding: 8px 16px 12px; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 13px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    font-size: 12.5px;
    font-weight: 500;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.06); color: var(--accent-ink); }
  .btn.sm { padding: 5px 10px; font-size: 11.5px; }

  .field-inline {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
  }
  .field-inline label { font-size: 12.5px; color: var(--text-dim); }
  .field-inline input {
    padding: 7px 9px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--bg);
    color: var(--text);
    font-variant-numeric: tabular-nums;
    width: 140px;
  }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: var(--text);
    color: var(--bg);
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 12.5px;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
    z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  dialog.modal {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 0;
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow);
    width: min(440px, 90vw);
  }
  dialog.modal::backdrop { background: rgba(10, 12, 15, 0.45); }
  .modal-head { padding: 16px 18px 6px; }
  .modal-head h3 { font-family: var(--serif); margin: 0; font-size: 17px; }
  .modal-body { padding: 10px 18px 4px; color: var(--text-dim); font-size: 13px; }
  .modal-body input { width: 100%; margin-top: 8px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px; background: var(--bg); color: var(--text); }
  .modal-foot { padding: 14px 18px 18px; display: flex; justify-content: flex-end; gap: 8px; }

  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    .sidebar {
      flex-direction: row;
      align-items: center;
      overflow-x: auto;
      border-right: none;
      border-bottom: 1px solid var(--border);
      padding: 12px 14px;
      gap: 16px;
    }
    .wordmark { flex: none; }
    .biz-switch, nav.depts { flex-direction: row; }
    .sidebar-foot { display: none; }
    main { padding: 22px 18px 50px; }
  }
</style>

<div class="app">
  <aside class="sidebar">
    <div class="wordmark"><span class="glyph">&#128210;</span>Ops Desk<small>personal mgmt team</small></div>

    <div class="biz-switch">
      <div class="biz-label">Business</div>
      <div id="bizList"></div>
    </div>

    <nav class="depts" id="deptNav"></nav>

    <div class="sidebar-foot">
      <button class="ghost-btn" id="renameBtn">&#9998;&nbsp; Rename business</button>
      <button class="ghost-btn" id="exportBtn">&#8595;&nbsp; Export data</button>
      <button class="ghost-btn" id="importBtn">&#8593;&nbsp; Import backup</button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
    </div>
  </aside>

  <main id="main"></main>
</div>

<div class="toast" id="toast"></div>

<dialog class="modal" id="renameModal">
  <div class="modal-head"><h3>Rename business</h3></div>
  <div class="modal-body">
    <label>Display name</label>
    <input type="text" id="renameInput">
  </div>
  <div class="modal-foot">
    <button class="btn" id="renameCancel">Cancel</button>
    <button class="btn primary" id="renameSave">Save</button>
  </div>
</dialog>

<script>
(function () {
  "use strict";

  /* ======================= Schema / config ======================= */

  var STAGE_COLORS = {
    "New": "var(--text-faint)", "Contacted": "var(--warning)", "Quoted": "var(--accent)",
    "Won": "var(--good)", "Lost": "var(--critical)",
    "Planned": "var(--text-faint)", "Active": "var(--accent)", "Paused": "var(--warning)", "Completed": "var(--good)",
    "Idea": "var(--text-faint)", "Drafted": "var(--warning)", "Scheduled": "var(--accent)", "Posted": "var(--good)",
    "Unpaid": "var(--warning)", "Paid": "var(--good)", "Overdue": "var(--critical)",
    "Not started": "var(--text-faint)", "In progress": "var(--accent)", "Done": "var(--good)", "Blocked": "var(--critical)",
    "Open": "var(--warning)", "Resolved": "var(--good)",
    "Employee": "var(--accent)", "Contractor": "var(--text-faint)"
  };

  function col(key, label, type, extra) {
    return Object.assign({ key: key, label: label, type: type || "text" }, extra || {});
  }

  var DEPARTMENTS = [
    { id: "dashboard", label: "Dashboard", icon: "&#9673;" },
    {
      id: "finance", label: "Finance", icon: "&#164;", agent: "finance-manager", file: "data/finance/ledger.md",
      tables: [
        {
          key: "transactions", title: "Transactions", addLabel: "Add transaction",
          columns: [
            col("date", "Date", "date"),
            col("description", "Description", "text", { wide: true }),
            col("category", "Category", "select", { options: ["Revenue", "Cost of Goods", "Marketing", "Operations", "Payroll", "Other"] }),
            col("amount", "Amount", "number")
          ]
        },
        {
          key: "invoices", title: "Open invoices", addLabel: "Add invoice",
          columns: [
            col("dateIssued", "Issued", "date"),
            col("customer", "Customer", "text", { name: true }),
            col("amount", "Amount", "number"),
            col("dueDate", "Due", "date"),
            col("status", "Status", "select", { options: ["Unpaid", "Paid", "Overdue"] })
          ]
        }
      ]
    },
    {
      id: "marketing", label: "Marketing", icon: "&#9993;", agent: "marketing-director", file: "data/marketing/campaigns.md",
      tables: [
        {
          key: "campaigns", title: "Active campaigns", addLabel: "Add campaign",
          columns: [
            col("name", "Name", "text", { name: true }),
            col("channel", "Channel", "text"),
            col("offer", "Offer / message", "text", { wide: true }),
            col("startDate", "Start", "date"),
            col("status", "Status", "select", { options: ["Planned", "Active", "Paused", "Completed"] }),
            col("result", "Result so far", "text", { wide: true })
          ]
        },
        {
          key: "content", title: "Content calendar", addLabel: "Add post",
          columns: [
            col("date", "Date", "date"),
            col("channel", "Channel", "text"),
            col("content", "Post / content", "text", { wide: true }),
            col("status", "Status", "select", { options: ["Idea", "Drafted", "Scheduled", "Posted"] })
          ]
        },
        {
          key: "leadSources", title: "Lead source performance", addLabel: "Add source",
          columns: [
            col("source", "Source", "text", { name: true }),
            col("leadsGenerated", "Leads gen.", "number"),
            col("leadsConverted", "Converted", "number"),
            col("notes", "Notes", "text", { wide: true })
          ]
        }
      ]
    },
    {
      id: "sales", label: "Sales", icon: "&#8644;", agent: "sales-manager", file: "data/sales/pipeline.md",
      tables: [
        {
          key: "pipeline", title: "Open leads / deals", addLabel: "Add lead",
          columns: [
            col("name", "Name", "text", { name: true }),
            col("source", "Source", "text"),
            col("stage", "Stage", "select", { options: ["New", "Contacted", "Quoted", "Won", "Lost"] }),
            col("value", "Value", "number"),
            col("lastContact", "Last contact", "date"),
            col("nextAction", "Next action", "text"),
            col("nextActionDate", "Next date", "date")
          ]
        },
        {
          key: "closed", title: "Closed", addLabel: "Add closed deal",
          columns: [
            col("name", "Name", "text", { name: true }),
            col("outcome", "Outcome", "select", { options: ["Won", "Lost"] }),
            col("value", "Value", "number"),
            col("dateClosed", "Date closed", "date"),
            col("why", "Why", "text", { wide: true })
          ]
        }
      ]
    },
    {
      id: "operations", label: "Operations", icon: "&#9881;", agent: "operations-manager", file: "data/operations/tasks.md",
      tables: [
        {
          key: "tasks", title: "Open tasks", addLabel: "Add task",
          columns: [
            col("task", "Task", "text", { wide: true }),
            col("dueDate", "Due", "date"),
            col("owner", "Owner", "text"),
            col("status", "Status", "select", { options: ["Not started", "In progress", "Done", "Blocked"] })
          ]
        },
        {
          key: "chores", title: "Recurring chores", addLabel: "Add chore",
          columns: [
            col("chore", "Chore", "text", { wide: true }),
            col("cadence", "Cadence", "text"),
            col("lastDone", "Last done", "date"),
            col("nextDue", "Next due", "date")
          ]
        },
        {
          key: "vendors", title: "Vendors / suppliers", addLabel: "Add vendor",
          columns: [
            col("vendor", "Vendor", "text", { name: true }),
            col("provides", "Provides", "text", { wide: true }),
            col("contact", "Contact", "text"),
            col("cadence", "Order cadence", "text")
          ]
        }
      ]
    },
    {
      id: "hr", label: "HR & Admin", icon: "&#9825;", agent: "hr-admin", file: "data/hr/roster.md",
      tables: [
        {
          key: "team", title: "Team", addLabel: "Add person",
          columns: [
            col("name", "Name", "text", { name: true }),
            col("role", "Role", "text"),
            col("type", "Type", "select", { options: ["Employee", "Contractor"] }),
            col("startDate", "Start", "date"),
            col("notes", "Notes", "text", { wide: true })
          ]
        },
        {
          key: "support", title: "Open support items", addLabel: "Add item",
          columns: [
            col("date", "Date", "date"),
            col("customer", "Customer", "text", { name: true }),
            col("issue", "Issue", "text", { wide: true }),
            col("status", "Status", "select", { options: ["Open", "In progress", "Resolved"] })
          ]
        },
        {
          key: "policies", title: "Policies on file", addLabel: "Add policy",
          columns: [
            col("policy", "Policy", "text", { name: true }),
            col("details", "Details", "text", { wide: true })
          ]
        }
      ]
    }
  ];

  var DEPT_BY_ID = {};
  DEPARTMENTS.forEach(function (d) { DEPT_BY_ID[d.id] = d; });

  /* ======================= State ======================= */

  var STORE_KEY = "opsdesk.v1";

  function emptyBusiness(name) {
    return {
      name: name,
      finance: { startingBalance: 0, transactions: [], invoices: [] },
      marketing: { campaigns: [], content: [], leadSources: [] },
      sales: { pipeline: [], closed: [] },
      operations: { tasks: [], chores: [], vendors: [] },
      hr: { team: [], support: [], policies: [] }
    };
  }

  function defaultState() {
    return {
      activeBiz: "dcb",
      activeDept: "dashboard",
      businesses: {
        dcb: emptyBusiness("DCB"),
        mine: emptyBusiness("My Business")
      },
      bizOrder: ["dcb", "mine"]
    };
  }

  var state;
  try {
    var raw = localStorage.getItem(STORE_KEY);
    state = raw ? JSON.parse(raw) : defaultState();
  } catch (e) {
    state = defaultState();
  }
  if (!state.businesses) state = defaultState();

  function persist() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
  }

  function currentBiz() { return state.businesses[state.activeBiz]; }

  function tableData(biz, deptId, tableKey) {
    if (!biz[deptId]) biz[deptId] = {};
    if (!biz[deptId][tableKey]) biz[deptId][tableKey] = [];
    return biz[deptId][tableKey];
  }

  /* ======================= Helpers ======================= */

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function fmtMoney(n) {
    n = Number(n) || 0;
    var neg = n < 0;
    var s = "$" + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return neg ? "(" + s + ")" : s;
  }

  function fmtDate(iso) {
    if (!iso) return "";
    var d = new Date(iso + "T00:00:00");
    if (isNaN(d)) return iso;
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  function daysFromToday(iso) {
    if (!iso) return null;
    var d = new Date(iso + "T00:00:00");
    if (isNaN(d)) return null;
    var t = new Date(todayISO() + "T00:00:00");
    return Math.round((d - t) / 86400000);
  }

  function relDate(iso) {
    var n = daysFromToday(iso);
    if (n === null) return "";
    if (n === 0) return "today";
    if (n === 1) return "tomorrow";
    if (n === -1) return "yesterday";
    if (n > 0) return "in " + n + "d";
    return Math.abs(n) + "d ago";
  }

  var toastTimer;
  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2200);
  }

  /* ======================= Sidebar ======================= */

  function renderSidebar() {
    var bizList = document.getElementById("bizList");
    bizList.innerHTML = "";
    state.bizOrder.forEach(function (id) {
      var b = state.businesses[id];
      if (!b) return;
      var btn = document.createElement("button");
      btn.className = "biz-btn" + (id === state.activeBiz ? " active" : "");
      btn.innerHTML = '<span class="dot"></span><span class="name">' + esc(b.name) + "</span>";
      btn.addEventListener("click", function () {
        state.activeBiz = id;
        persist();
        renderAll();
      });
      bizList.appendChild(btn);
    });

    var nav = document.getElementById("deptNav");
    nav.innerHTML = "";
    var biz = currentBiz();
    var attn = computeAttention(biz);
    DEPARTMENTS.forEach(function (d) {
      var btn = document.createElement("button");
      btn.className = "nav-item" + (d.id === state.activeDept ? " active" : "");
      var badgeCount = attn.byDept[d.id] || 0;
      btn.innerHTML = '<span class="ic">' + d.icon + '</span><span>' + d.label + "</span>" +
        (badgeCount ? '<span class="badge">' + badgeCount + "</span>" : "");
      btn.addEventListener("click", function () {
        state.activeDept = d.id;
        persist();
        renderAll();
      });
      nav.appendChild(btn);
    });
  }

  /* ======================= Attention engine ======================= */

  function computeAttention(biz) {
    var items = [];
    var byDept = {};

    function push(deptId, sev, text, dateISO) {
      items.push({ dept: deptId, sev: sev, text: text, date: dateISO });
      byDept[deptId] = (byDept[deptId] || 0) + 1;
    }

    (biz.finance.invoices || []).forEach(function (inv) {
      if (inv.status === "Paid") return;
      var d = daysFromToday(inv.dueDate);
      if (d !== null && d < 0) push("finance", "critical", "Invoice overdue — " + (inv.customer || "unnamed") + " (" + fmtMoney(inv.amount) + ")", inv.dueDate);
      else if (d !== null && d <= 3) push("finance", "warning", "Invoice due soon — " + (inv.customer || "unnamed") + " (" + fmtMoney(inv.amount) + ")", inv.dueDate);
    });

    (biz.sales.pipeline || []).forEach(function (lead) {
      var d = daysFromToday(lead.nextActionDate);
      if (d !== null && d < 0) push("sales", "critical", "Follow-up overdue — " + (lead.name || "unnamed lead"), lead.nextActionDate);
      else if (d !== null && d <= 1) push("sales", "warning", "Follow-up due — " + (lead.name || "unnamed lead"), lead.nextActionDate);
    });

    (biz.operations.tasks || []).forEach(function (t) {
      if (t.status === "Done") return;
      var d = daysFromToday(t.dueDate);
      if (d !== null && d < 0) push("operations", "critical", "Task overdue — " + (t.task || "untitled task"), t.dueDate);
      else if (d !== null && d <= 2) push("operations", "warning", "Task due soon — " + (t.task || "untitled task"), t.dueDate);
    });

    (biz.hr.support || []).forEach(function (s) {
      if (s.status === "Resolved") return;
      push("hr", "warning", "Support item open — " + (s.customer || "unnamed") + ": " + (s.issue || ""), s.date);
    });

    items.sort(function (a, b) {
      if (a.sev !== b.sev) return a.sev === "critical" ? -1 : 1;
      return (a.date || "9999") < (b.date || "9999") ? -1 : 1;
    });

    return { items: items, byDept: byDept };
  }

  /* ======================= Dashboard ======================= */

  function financeBalance(biz) {
    var bal = Number(biz.finance.startingBalance) || 0;
    (biz.finance.transactions || []).forEach(function (t) { bal += Number(t.amount) || 0; });
    return bal;
  }

  function renderDashboard(root, biz) {
    var balance = financeBalance(biz);
    var unpaid = (biz.finance.invoices || []).filter(function (i) { return i.status !== "Paid"; });
    var unpaidTotal = unpaid.reduce(function (s, i) { return s + (Number(i.amount) || 0); }, 0);

    var openLeads = biz.sales.pipeline || [];
    var closed = biz.sales.closed || [];
    var won = closed.filter(function (c) { return c.outcome === "Won"; }).length;
    var lost = closed.filter(function (c) { return c.outcome === "Lost"; }).length;
    var winRate = (won + lost) > 0 ? Math.round((won / (won + lost)) * 100) : null;

    var openTasks = (biz.operations.tasks || []).filter(function (t) { return t.status !== "Done"; }).length;
    var overdueTasks = (biz.operations.tasks || []).filter(function (t) { return t.status !== "Done" && daysFromToday(t.dueDate) < 0; }).length;

    var openSupport = (biz.hr.support || []).filter(function (s) { return s.status !== "Resolved"; }).length;
    var activeCampaigns = (biz.marketing.campaigns || []).filter(function (c) { return c.status === "Active"; }).length;

    var html = "";
    html += '<header class="pagehead"><div><h1>' + esc(biz.name) + " overview</h1>" +
      '<div class="sub">Everything the team is tracking, in one look</div></div></header>';

    html += '<div class="tiles">';
    html += tile("Cash balance", fmtMoney(balance), balance < 0 ? "critical" : "", unpaid.length ? unpaid.length + " unpaid invoice" + (unpaid.length === 1 ? "" : "s") + " · " + fmtMoney(unpaidTotal) : "No unpaid invoices");
    html += tile("Open leads", String(openLeads.length), "", winRate === null ? "No closed deals yet" : winRate + "% win rate");
    html += tile("Open tasks", String(openTasks), overdueTasks ? "critical" : "", overdueTasks ? overdueTasks + " overdue" : "On schedule");
    html += tile("Active campaigns", String(activeCampaigns), "", openSupport ? openSupport + " support item" + (openSupport === 1 ? "" : "s") + " open" : "No open support items");
    html += "</div>";

    var attn = computeAttention(biz);
    html += '<section class="block"><div class="block-head"><h2>Needs attention</h2><span class="count">' + attn.items.length + "</span></div>";
    html += '<div class="block-body">';
    if (!attn.items.length) {
      html += '<div class="empty">Nothing overdue or due imminently. Add data on any tab to start tracking it here.</div>';
    } else {
      attn.items.slice(0, 12).forEach(function (it) {
        html += '<div class="attn-row"><span class="attn-chip ' + it.sev + '">' + it.dept + '</span>' +
          '<span class="attn-text">' + esc(it.text) + '</span>' +
          '<span class="attn-when">' + esc(relDate(it.date)) + "</span></div>";
      });
    }
    html += "</div></section>";

    root.innerHTML = html;
  }

  function tile(label, value, cls, foot) {
    return '<div class="tile"><div class="label">' + esc(label) + '</div>' +
      '<div class="value ' + (cls || "") + '">' + esc(value) + '</div>' +
      '<div class="foot">' + esc(foot) + "</div></div>";
  }

  /* ======================= Department table view ======================= */

  function renderDepartment(root, biz, dept) {
    var html = '<header class="pagehead"><div><h1>' + esc(dept.label) + '</h1>' +
      '<div class="sub">Feeds the <code>' + dept.agent + '</code> agent · <code>' + dept.file + '</code></div></div></header>';

    if (dept.id === "finance") {
      html += '<section class="block"><div class="block-head"><h2>Starting cash balance</h2></div>' +
        '<div class="field-inline"><label>As of today</label>' +
        '<input type="number" step="0.01" id="startingBalance" value="' + esc(biz.finance.startingBalance) + '"></div></section>';
    }

    root.innerHTML = html;

    if (dept.id === "finance") {
      document.getElementById("startingBalance").addEventListener("change", function (e) {
        biz.finance.startingBalance = parseFloat(e.target.value) || 0;
        persist();
        renderSidebar();
      });
    }

    dept.tables.forEach(function (t) {
      var section = document.createElement("section");
      section.className = "block";
      root.appendChild(section);
      renderTable(section, biz, dept, t);
    });
  }

  function renderTable(section, biz, dept, tconf) {
    var rows = tableData(biz, dept.id, tconf.key);

    var head = document.createElement("div");
    head.className = "block-head";
    head.innerHTML = "<h2>" + esc(tconf.title) + '</h2><span class="count">' + rows.length + "</span>";
    section.appendChild(head);

    var body = document.createElement("div");
    body.className = "block-body";
    section.appendChild(body);

    var twrap = document.createElement("div");
    twrap.className = "twrap";
    body.appendChild(twrap);

    var table = document.createElement("table");
    table.className = "data";
    twrap.appendChild(table);

    var thead = document.createElement("thead");
    var thr = document.createElement("tr");
    tconf.columns.forEach(function (c) {
      var th = document.createElement("th");
      th.textContent = c.label;
      thr.appendChild(th);
    });
    thr.appendChild(document.createElement("th"));
    thead.appendChild(thr);
    table.appendChild(thead);

    var tbody = document.createElement("tbody");
    table.appendChild(tbody);

    function redraw() {
      tbody.innerHTML = "";
      if (!rows.length) {
        var tr = document.createElement("tr");
        var td = document.createElement("td");
        td.colSpan = tconf.columns.length + 1;
        td.className = "empty";
        td.textContent = "No rows yet — add one below.";
        tr.appendChild(td);
        tbody.appendChild(tr);
        return;
      }
      rows.forEach(function (row, idx) {
        tbody.appendChild(buildRow(row, idx));
      });
    }

    function buildRow(row, idx) {
      var tr = document.createElement("tr");
      tconf.columns.forEach(function (c) {
        var td = document.createElement("td");
        if (c.name) td.className = "col-name";
        if (c.wide) td.className = "col-wide";

        if (c.type === "select") {
          var sel = document.createElement("select");
          sel.className = "cell-select";
          var blank = document.createElement("option");
          blank.value = ""; blank.textContent = "—";
          sel.appendChild(blank);
          c.options.forEach(function (opt) {
            var o = document.createElement("option");
            o.value = opt; o.textContent = opt;
            if (row[c.key] === opt) o.selected = true;
            sel.appendChild(o);
          });
          sel.addEventListener("change", function () {
            row[c.key] = sel.value;
            persist();
            renderSidebar();
            if (dept.id === "dashboard" || true) refreshDashboardIfActive();
          });
          td.appendChild(sel);
          if (row[c.key] && STAGE_COLORS[row[c.key]]) {
            td.style.borderLeft = "3px solid " + STAGE_COLORS[row[c.key]];
          }
        } else {
          var inp = document.createElement("input");
          inp.className = "cell-input" + (c.type === "number" ? " num" : "") + (c.type === "date" ? " date" : "");
          inp.type = c.type === "number" ? "number" : (c.type === "date" ? "date" : "text");
          if (c.type === "number") inp.step = "0.01";
          inp.value = row[c.key] == null ? "" : row[c.key];
          inp.addEventListener("change", function () {
            row[c.key] = c.type === "number" ? (parseFloat(inp.value) || 0) : inp.value;
            persist();
            renderSidebar();
            refreshDashboardIfActive();
          });
          td.appendChild(inp);
        }
        tr.appendChild(td);
      });

      var tdDel = document.createElement("td");
      var del = document.createElement("button");
      del.className = "row-del";
      del.innerHTML = "&#10005;";
      del.title = "Delete row";
      del.addEventListener("click", function () {
        rows.splice(idx, 1);
        persist();
        head.querySelector(".count").textContent = rows.length;
        redraw();
        renderSidebar();
      });
      tdDel.appendChild(del);
      tr.appendChild(tdDel);
      return tr;
    }

    redraw();

    var addBar = document.createElement("div");
    addBar.className = "add-row-bar";
    var addBtn = document.createElement("button");
    addBtn.className = "btn";
    addBtn.innerHTML = "+ " + esc(tconf.addLabel);
    addBtn.addEventListener("click", function () {
      var blank = {};
      tconf.columns.forEach(function (c) { blank[c.key] = c.type === "number" ? 0 : ""; });
      if (tconf.columns.some(function (c) { return c.key === "date"; })) blank.date = todayISO();
      rows.push(blank);
      persist();
      head.querySelector(".count").textContent = rows.length;
      redraw();
      renderSidebar();
    });
    addBar.appendChild(addBtn);
    body.appendChild(addBar);
  }

  function refreshDashboardIfActive() {
    if (state.activeDept === "dashboard") {
      renderDashboard(document.getElementById("main"), currentBiz());
    }
  }

  /* ======================= Root render ======================= */

  function renderAll() {
    renderSidebar();
    var root = document.getElementById("main");
    var biz = currentBiz();
    var dept = DEPT_BY_ID[state.activeDept] || DEPARTMENTS[0];
    if (dept.id === "dashboard") renderDashboard(root, biz);
    else renderDepartment(root, biz, dept);
  }

  /* ======================= Export / Import ======================= */

  function mdEscape(s) {
    return String(s == null ? "" : s).replace(/\|/g, "\\|");
  }

  function mdTable(columns, rows) {
    var headers = columns.map(function (c) { return c.label; });
    var lines = [];
    lines.push("| " + headers.join(" | ") + " |");
    lines.push("|" + headers.map(function () { return "---"; }).join("|") + "|");
    if (!rows.length) {
      lines.push("| " + headers.map(function (h, i) { return i === 0 ? "_(none yet)_" : ""; }).join(" | ") + " |");
    } else {
      rows.forEach(function (r) {
        lines.push("| " + columns.map(function (c) {
          var v = r[c.key];
          if (c.type === "number") v = (Number(v) || 0).toFixed(2);
          return mdEscape(v);
        }).join(" | ") + " |");
      });
    }
    return lines.join("\n");
  }

  function exportMarkdown(biz) {
    var out = "# " + biz.name + " — exported from Ops Desk on " + todayISO() + "\n\n";
    out += "This mirrors the personal management team's data/*.md files — paste each section into the matching file.\n\n";

    out += "## data/finance/ledger.md\n\n";
    out += "Starting balance: $" + (Number(biz.finance.startingBalance) || 0).toFixed(2) + "\n\n### Transactions\n" +
      mdTable(DEPT_BY_ID.finance.tables[0].columns, biz.finance.transactions) + "\n\n### Open invoices\n" +
      mdTable(DEPT_BY_ID.finance.tables[1].columns, biz.finance.invoices) + "\n\n";

    out += "## data/marketing/campaigns.md\n\n### Active campaigns\n" +
      mdTable(DEPT_BY_ID.marketing.tables[0].columns, biz.marketing.campaigns) + "\n\n### Content calendar\n" +
      mdTable(DEPT_BY_ID.marketing.tables[1].columns, biz.marketing.content) + "\n\n### Lead source performance\n" +
      mdTable(DEPT_BY_ID.marketing.tables[2].columns, biz.marketing.leadSources) + "\n\n";

    out += "## data/sales/pipeline.md\n\n### Open leads / deals\n" +
      mdTable(DEPT_BY_ID.sales.tables[0].columns, biz.sales.pipeline) + "\n\n### Closed\n" +
      mdTable(DEPT_BY_ID.sales.tables[1].columns, biz.sales.closed) + "\n\n";

    out += "## data/operations/tasks.md\n\n### Open tasks\n" +
      mdTable(DEPT_BY_ID.operations.tables[0].columns, biz.operations.tasks) + "\n\n### Recurring chores\n" +
      mdTable(DEPT_BY_ID.operations.tables[1].columns, biz.operations.chores) + "\n\n### Vendors / suppliers\n" +
      mdTable(DEPT_BY_ID.operations.tables[2].columns, biz.operations.vendors) + "\n\n";

    out += "## data/hr/roster.md\n\n### Team\n" +
      mdTable(DEPT_BY_ID.hr.tables[0].columns, biz.hr.team) + "\n\n### Open support items\n" +
      mdTable(DEPT_BY_ID.hr.tables[1].columns, biz.hr.support) + "\n\n### Policies\n" +
      mdTable(DEPT_BY_ID.hr.tables[2].columns, biz.hr.policies) + "\n";

    return out;
  }

  async function doExport() {
    var biz = currentBiz();
    var slug = biz.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "business";

    if (window.claude && window.claude.downloads) {
      try {
        await window.claude.downloads.save({ filename: slug + "-backup.json", data: JSON.stringify(state, null, 2) });
        await window.claude.downloads.save({ filename: slug + "-export.md", data: exportMarkdown(biz) });
        toast("Exported " + biz.name + " as JSON backup + Markdown");
        return;
      } catch (err) {
        if (err && err.code === "declined") { toast("Export cancelled"); return; }
        /* fall through to manual copy on any other error */
      }
    }
    var w = window.open("", "_blank");
    if (w) {
      w.document.write("<pre style='white-space:pre-wrap;font-family:monospace;padding:20px'>" + esc(exportMarkdown(biz)) + "</pre>");
      toast("Downloads unavailable here — opened export in a new tab to copy");
    } else {
      toast("Could not export — downloads are unavailable in this view");
    }
  }

  function doImport(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var incoming = JSON.parse(reader.result);
        if (!incoming || !incoming.businesses) throw new Error("bad shape");
        state = incoming;
        persist();
        renderAll();
        toast("Backup imported");
      } catch (e) {
        toast("That file didn't look like an Ops Desk backup");
      }
    };
    reader.readAsText(file);
  }

  /* ======================= Wire up chrome ======================= */

  document.getElementById("exportBtn").addEventListener("click", doExport);
  document.getElementById("importBtn").addEventListener("click", function () {
    document.getElementById("importFile").click();
  });
  document.getElementById("importFile").addEventListener("change", function (e) {
    if (e.target.files && e.target.files[0]) doImport(e.target.files[0]);
    e.target.value = "";
  });

  var renameModal = document.getElementById("renameModal");
  document.getElementById("renameBtn").addEventListener("click", function () {
    document.getElementById("renameInput").value = currentBiz().name;
    renameModal.showModal();
  });
  document.getElementById("renameCancel").addEventListener("click", function () { renameModal.close(); });
  document.getElementById("renameSave").addEventListener("click", function () {
    var v = document.getElementById("renameInput").value.trim();
    if (v) currentBiz().name = v;
    persist();
    renameModal.close();
    renderAll();
  });

  renderAll();
})();
</script>
